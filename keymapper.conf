# ====================================================================
# Essential KeyMapper Configuration File
# Target: Nothing CMF Phone 1/2 Pro (Galaga) & AOSP/Voltage OS
# Path: /data/adb/modules/essential_keymapper/keymapper.conf
# Changes take effect automatically without rebooting!
# ====================================================================
# Supported Built-in Actions:
#   default         - Let system handle key normally
#   none            - Do nothing / ignore event
#   flashlight      - Toggle flashlight ON / OFF
#   screenshot      - Capture screen
#   play_pause      - Media Play/Pause toggle
#   next_track      - Skip to next media track
#   prev_track      - Skip to previous media track
#   volume_up       - Increase media volume
#   volume_down     - Decrease media volume
#   mute_toggle     - Cycle Normal -> Vibrate -> Silent
#   screen_off      - Turn screen off / Lock
#   screen_on       - Wake screen up
#   camera          - Launch default camera app
#   notifications   - Expand notification drawer
#   quick_settings  - Expand quick settings tiles
#   kill_app        - Force kill active foreground app
#   shell <cmd>     - Execute arbitrary root shell command
#                     e.g.: shell input tap 500 500
# ====================================================================

[global]
# Double press timeout in milliseconds (default: 300)
double_click_ms = 300

# Triple press timeout in milliseconds (default: 450)
triple_click_ms = 450

# Long press hold threshold in milliseconds (default: 480)
long_press_ms = 480

# Logging level: 0=Quiet, 1=Info, 2=Debug
log_level = 1

# --------------------------------------------------------------------
# Key 250 (0xfa): Essential / Action Key (Nothing CMF Phone)
# --------------------------------------------------------------------
[key_essential]
single_press = flashlight
double_press = screenshot
triple_press = none
long_press = camera

# Screen-off behavior for Essential Key
screen_off_single = flashlight
screen_off_double = play_pause
screen_off_long = flashlight

# --------------------------------------------------------------------
# Key 114: Volume Down Button
# --------------------------------------------------------------------
[key_volume_down]
single_press = default
double_press = none
triple_press = none
long_press = none

screen_off_single = default
screen_off_double = none
# Hold Volume Down while screen is OFF to go to Previous Track
screen_off_long = prev_track

# --------------------------------------------------------------------
# Key 115: Volume Up Button
# --------------------------------------------------------------------
[key_volume_up]
single_press = default
double_press = none
triple_press = none
long_press = none

screen_off_single = default
screen_off_double = none
# Hold Volume Up while screen is OFF to skip to Next Track
screen_off_long = next_track

# --------------------------------------------------------------------
# Key 116: Power Button
# --------------------------------------------------------------------
[key_power]
single_press = default
double_press = default
triple_press = none
long_press = default

screen_off_single = default
screen_off_double = default
screen_off_long = default

# --------------------------------------------------------------------
# Button Combinations (Pressed Simultaneously)
# --------------------------------------------------------------------
[combos]
# Volume Up + Volume Down pressed together
volup_and_voldown = screenshot

# Essential Button + Volume Down pressed together
essential_and_voldown = notifications

# Essential Button + Volume Up pressed together
essential_and_volup = quick_settings

# Power + Volume Up pressed together
power_and_volup = none

# Power + Volume Down pressed together (default Android screenshot)
power_and_voldown = default
